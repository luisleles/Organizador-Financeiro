services:
  # Roda uma vez e sai. O app só sobe depois que o schema está no lugar.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - app-data:/app/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/app.db
    # Só escuta em localhost: quem for expor à internet põe um proxy com TLS na frente.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # O banco vive fora da imagem: recriar o contêiner não pode levar os dados junto.
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

volumes:
  app-data:
